version: 1
defaults:
  timeout_minutes: 45
  network: internal
  read_only: true
  cap_drop:
  - ALL
  no_new_privileges: true
  pids_limit: 128
  memory: 256m
  cpus: 0.5
challenges:
- slug: scope-guard
  module: safety
  difficulty: beginner
  title_tr: Kapsam dışını reddet
  type: defense
  objective: Runner'ın RFC1918 üretim adresi ve izin listesi dışındaki hedefleri reddettiğini
    doğrula.
  score: 100
  verifier: verify_scope_guard
  guide: read source → probe 192.0.2.10 → flag gönder → patch allowlist → savunmayı
    doğrula. Gerçek ağ isteği yapılmaz.
- slug: linux-permission-leak
  module: linux
  difficulty: beginner
  title_tr: Fazla izinli yedek
  type: attack_defense
  objective: Geçici yedekteki dünya-okuma iznini kanıtla; dosya modunu 600 yaparak
    yetki modelini düzelt.
  score: 220
  paired_checks:
  - flag_read
  - service_still_works
  - unauthorized_read_fails
  guide: read source → probe → flag gönder → patch 600 → savunmayı doğrula. Yalnız
    bu labın geçici yedek dosyası değişir.
- slug: path-shadow
  module: linux
  difficulty: beginner
  title_tr: Yanlış program çalışıyor
  type: attack_defense
  objective: Kopya shell ortamında PATH sırasını kullanarak davranışı açıkla ve mutlak
    yol/temiz env ile düzelt.
  score: 240
  guide: read source → probe → flag gönder → patch absolute-path → savunmayı doğrula.
    PATH kararı modellenir; host shell çalıştırılmaz.
- slug: service-map
  module: network
  difficulty: beginner
  title_tr: Lab ağını haritala
  type: attack_defense
  objective: Sağlanan lab servis haritasında debug sızıntısını bul; health işlevini
    koruyarak kapat.
  score: 240
  max_scan_hosts: 8
  guide: probe → debug servisini bul → flag gönder → patch close-debug → savunmayı
    doğrula. Sağlanan servis haritası kullanılır; ağ taraması yoktur.
- slug: http-info-leak
  module: web
  difficulty: beginner
  title_tr: Debug izi
  type: attack_defense
  objective: Header ve directory listing sızıntısından flag'i bul; debug bilgisini
    kapat.
  score: 260
  guide: read source → probe → sızan başlıktaki flag → patch no-debug → savunmayı
    doğrula.
- slug: object-ownership
  module: identity
  difficulty: intermediate
  title_tr: Bu not kimin?
  type: attack_defense
  objective: Toy not uygulamasında nesne sahipliği açığını kanıtla ve server-side
    authorization ekle.
  score: 400
  guide: read source → probe 1 ve probe 2 → flag gönder → patch owner-check → savunmayı
    doğrula.
- slug: sqlite-parameter
  module: injection
  difficulty: intermediate
  title_tr: Sorguyu ayır
  type: attack_defense
  objective: Toy SQLite login sorgusunda enjeksiyonu kanıtla ve parametrik sorguyla
    düzelt.
  score: 420
  destructive_sql_blocked: true
  guide: read source → probe "' OR 1=1 --" → flag gönder → patch parameterized → savunmayı
    doğrula. Sorgu tek kullanımlık, bellek içi SQLite üzerinde çalışır.
- slug: auth-log-hunt
  module: blue-team
  difficulty: beginner
  title_tr: Gürültü içindeki deneme
  type: defense
  objective: Sağlanan log paketinde brute-force dizisini correlation ID ve zaman çizgisiyle
    açıkla.
  score: 300
  guide: read logs → probe <olay-kimliği> → kanıt flag değerini gönder → patch correlation
    → savunmayı doğrula.
- slug: c-stack-boundary
  module: memory
  difficulty: intermediate
  title_tr: Sınırın bir bayt ötesi
  type: attack_defense
  objective: Toy binary'de kontrollü taşmayı ASan ile gözle; sınır kontrolüyle düzelt.
  score: 500
  architecture: x86_64
  internet: false
  guide: read source → probe → ASan bulgusunu incele → flag gönder → patch bounded
    → savunmayı doğrula. Sağlanan C kaynakları konteynerde gerçekten derlenir.
- slug: c-format-string
  module: memory
  difficulty: intermediate
  title_tr: Format kullanıcı değildir
  type: attack_defense
  objective: Toy programın format string hatasıyla flag'i göster; sabit format ve
    uzunluk sınırı uygula.
  score: 520
  internet: false
  guide: read source → probe → kontrollü format yorumlamasını gözle → flag gönder
    → patch fixed-format → savunmayı doğrula.
- slug: cpp-raii-leak
  module: memory
  difficulty: beginner
  title_tr: Kaynağı sahibine ver
  type: defense
  objective: C++ örneğinde erken dönüş kaynak sızıntısını RAII ile gider; sanitizer
    testi geçsin.
  score: 300
  guide: read source → probe → canlı kaynak sayacını incele → flag gönder → patch
    raii → savunmayı doğrula.
- slug: container-least-privilege
  module: containers
  difficulty: intermediate
  title_tr: Fazla yetkili servis
  type: defense
  objective: Kopya compose manifestinden privileged, secret mount ve gereksiz capability'leri
    kaldır.
  score: 450
  guide: probe → kopya manifest risklerini incele → flag gönder → patch least-privilege
    → savunmayı doğrula. Host Docker ayarları değişmez.
- slug: final-incident
  module: final
  difficulty: intermediate
  title_tr: İzden yamaya
  type: attack_defense_report
  objective: Logdan vektörü bul, disposable hedefte doğrula, yamala ve regresyon testini
    geçir.
  score: 900
  prerequisites:
  - linux-permission-leak
  - sqlite-parameter
  - c-stack-boundary
  - auth-log-hunt
  guide: read logs → read source → probe "' OR 1=1 --" → flag gönder → patch parameterized
    → report "İlk erişim, log kanıtı, kök neden, düzeltme ve regresyonu açıklayan
    en az 80 karakterlik olay raporun" → savunmayı doğrula.
