  - Rastgele kimlik gizler ama yetki vermez.
  - Sunucu her istekte sahipliği sormalı.
  aciklama: Erişim kontrolü yalnız sunucuda güvenilirdir; istemci her şeyi değiştirebilir.
  xp: 60
  normalize: kucuk-bosluksuz
