- slug: guvenli-sorgu
  kategori: guvenli-kod
  zorluk: orta
  baslik_tr: Hangisi güvenli sorgu?
  soru: Kullanıcıdan gelen `ad` değeriyle veritabanı sorgusu yapan hangi Python satırı
    güvenlidir?
  cevap_tipi: secim
  secenekler:
  - cur.execute("SELECT * FROM uye WHERE ad = '" + ad + "'")
  - cur.execute(f"SELECT * FROM uye WHERE ad = '{ad}'")
  - cur.execute("SELECT * FROM uye WHERE ad = ?", (ad,))
  ipuclari:
  - Kullanıcı girdisi sorgu metnine yapıştırılmamalı.
  - Yer tutucu kullanan seçeneği ara.
  - Parametreli sorgu.
  aciklama: Parametreli sorgular girdiyi veri olarak taşır; metin birleştirmek SQL
    enjeksiyonuna yol açar.
  xp: 60
  normalize: kucuk-bosluksuz
  cevap_ozeti: 204618f987fac596e6fede4b7c1061fc18c52d47ad9c2a0b5e6310949c059075
- slug: tampon-sinir
  kategori: guvenli-kod
  zorluk: orta
  baslik_tr: Taşmayan kopya
  soru: '`char ad[16];` dizisine kullanıcı girdisi kopyalamak için hangisi sınırı
    aşmaz?'
  cevap_tipi: secim
  secenekler:
  - strcpy(ad, girdi);
  - snprintf(ad, sizeof ad, "%s", girdi);
  - sprintf(ad, girdi);
  ipuclari:
  - Hedef boyutunu bilen fonksiyonu seç.
  - sizeof ad bir sınırdır.
  - Biçim dizgesi sabit olmalı.
  aciklama: snprintf hedef boyutuna uyar ve biçim dizgesini sabit tutar; strcpy sınır
    bilmez, sprintf(ad, girdi) ayrıca biçim dizgesi hatası taşır.
  xp: 70
  normalize: kucuk-bosluksuz
  cevap_ozeti: 69ea9436892581c55874e9b8eb7e5c78f4028cf9386df5f939baab107989b154
- slug: yetki-kontrol
  kategori: guvenli-kod
  zorluk: orta
  baslik_tr: Yetki nerede kontrol edilmeli?
  soru: Bir kullanıcının başka birinin faturasını görmesini engellemek için kontrol
    nerede yapılmalı?
  cevap_tipi: secim
  secenekler:
  - Yalnız tarayıcıda düğmeyi gizleyerek
  - Sunucuda her istekte fatura sahibini doğrulayarak
