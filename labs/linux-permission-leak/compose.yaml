# linux-permission-leak — tek kullanımlık, internete/ev ağına kapalı lab hedefi
name: cyberlab
services:
  target-linux-perm:
    build: .
    image: flugel-cyberlab/linux-permission-leak:1
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /srv/yedek:uid=1000,gid=1000,mode=0755,size=1m
      - /tmp:size=4m
    environment:
      - CYBERLAB_FLAG
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [labnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 2s
      retries: 10
    labels:
      com.flugel.cyberlab.managed: "true"
      com.flugel.cyberlab.challenge: linux-permission-leak
networks:
  labnet:
    internal: true
    labels:
      com.flugel.cyberlab.managed: "true"
    ipam:
      config:
        - subnet: ${CYBERLAB_SUBNET:-10.213.0.0/28}
